<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="logo">StudyHub</div>
  </header>

  <main>
    <section class="hero">
      <h1>Welcome to StudyHub</h1>
      <p>Your one place to organise courses, notes and deadlines.</p>
      <button id="cta-btn" class="btn">Get Started</button>
    </section>

    <section class="features">
      <div class="card">
        <h3>Courses</h3>
        <p>Keep track of every subject you are enrolled in.</p>
      </div>
      <div class="card">
        <h3>Notes</h3>
        <p>Write and organise lecture notes in one place.</p>
      </div>
      <div class="card">
        <h3>Deadlines</h3>
        <p>Never miss an assignment submission again.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 StudyHub. Lab Exercise 1.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
